version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: franchisedunia-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - franchisedunia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franchisedunia-backend
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/franchisedunia
      - JWT_ACCESS_SECRET=franchisedunia_production_access_token_secret_key_2026
      - JWT_REFRESH_SECRET=franchisedunia_production_refresh_token_secret_key_2026
      - IP_HASH_SECRET=franchisedunia_hmac_sha256_ip_hash_secret_key_2026
      - FRONTEND_URL=http://localhost:3000
      - ENABLE_DEMO_MODE=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - franchisedunia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: franchisedunia-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:5001/api
    depends_on:
      - backend
    networks:
      - franchisedunia-network

volumes:
  mongo_data:
    driver: local

networks:
  franchisedunia-network:
    driver: bridge
